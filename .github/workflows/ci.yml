name: CI

on:
  push:
    branches: [master]
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  schedule:
    - cron: "17 3 * * *"  # nightly end-to-end run

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-unit:
    name: Python — lint, types, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Typecheck
        run: mypy
      - name: Unit tests
        run: pytest -m "not integration and not e2e" --cov=moodle_llm_chat --cov-report=term-missing

  python-integration:
    name: Python — integration tests
    runs-on: ubuntu-latest
    needs: python-unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Integration tests
        run: pytest -m integration

  detect-plugin:
    # hashFiles() is not allowed in a job-level `if`, so detect the plugin in a step.
    runs-on: ubuntu-latest
    outputs:
      present: ${{ steps.check.outputs.present }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          if [ -f moodle/local_llmchat/version.php ]; then echo "present=true" >> "$GITHUB_OUTPUT";
          else echo "present=false" >> "$GITHUB_OUTPUT"; fi

  moodle-plugin:
    name: Moodle plugin — ${{ matrix.moodle-branch }} / PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    needs: detect-plugin
    if: needs.detect-plugin.outputs.present == 'true'
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 3
    strategy:
      fail-fast: false
      matrix:
        include:
          - { php: "8.2", moodle-branch: "MOODLE_405_STABLE" }
          - { php: "8.3", moodle-branch: "MOODLE_500_STABLE" }
    steps:
      - uses: actions/checkout@v4
        with:
          path: plugin
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pgsql, zip, gd, xmlrpc, soap, sodium
          ini-values: max_input_vars=5000
          coverage: none
      - name: Install moodle-plugin-ci
        run: |
          composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci ^4
          echo "$(cd ci/bin; pwd)" >> "$GITHUB_PATH"
          echo "$(cd ci/vendor/bin; pwd)" >> "$GITHUB_PATH"
          sudo locale-gen en_AU.UTF-8
      - name: Install Moodle with the plugin
        run: moodle-plugin-ci install --plugin ./plugin/moodle/local_llmchat --db-host=127.0.0.1
        env:
          DB: pgsql
          MOODLE_BRANCH: ${{ matrix.moodle-branch }}
      - run: moodle-plugin-ci phplint
      - run: moodle-plugin-ci phpcs --max-warnings 0
      - run: moodle-plugin-ci phpdoc --max-warnings 0
      - run: moodle-plugin-ci validate
      - run: moodle-plugin-ci savepoints
      - run: moodle-plugin-ci mustache
      - run: moodle-plugin-ci grunt --max-lint-warnings 0
      - run: moodle-plugin-ci phpunit --fail-on-warning
      - name: Shared chat-token vectors agree with the API
        # The PHP and Python sides must derive the same key and verify the same tokens.
        run: cmp plugin/tests/fixtures/jwt_vectors.json plugin/moodle/local_llmchat/tests/fixtures/jwt_vectors.json

  e2e:
    name: End to end — Moodle + plugin + API + browser
    runs-on: ubuntu-latest
    needs: [python-integration, moodle-plugin]
    # ~10 minutes: on master, nightly, and on PRs labelled "e2e".
    if: >-
      github.event_name == 'push' || github.event_name == 'schedule' ||
      contains(github.event.pull_request.labels.*.name, 'e2e')
    steps:
      - uses: actions/checkout@v4
      - name: Build the stack
        run: docker compose -f tests/e2e/docker-compose.yml --profile test build
      - name: Start Moodle, API and the scripted model
        run: docker compose -f tests/e2e/docker-compose.yml up -d --wait moodle
      - name: Browser tests
        run: docker compose -f tests/e2e/docker-compose.yml run --name mlc-e2e-run runner
      - name: Logs on failure
        if: failure()
        run: docker compose -f tests/e2e/docker-compose.yml logs --no-color --tail=300
      - name: Collect Playwright traces
        if: failure()
        run: docker cp mlc-e2e-run:/artifacts tests/e2e/artifacts || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-traces
          path: tests/e2e/artifacts
      - name: Tear down
        if: always()
        run: docker compose -f tests/e2e/docker-compose.yml down -v
