# Local dev stack: a real Moodle 4.5 with local_llmchat, the API, and a real model of
# your choice. Not for production — fixed test credentials, plain http, debug on.
#
#   cp dev/.env.example dev/.env          # pick provider/model, add the API key
#   docker compose -f dev/docker-compose.yml up -d --build --wait
#   open http://localhost:8080            # student / Test1234!, admin / Admin1234!
#   docker compose -f dev/docker-compose.yml down        # keep data
#   docker compose -f dev/docker-compose.yml down -v     # wipe everything
#
# Why Moodle shares the API's network namespace: the plugin has one API URL, used both
# by Moodle (server side) and by the browser (websocket), and the API calls Moodle back
# at the site URL, which is also the browser's Origin. So "localhost:8080" (Moodle) and
# "localhost:8000" (API) must mean the same thing on the host and inside the
# containers. Sharing one namespace and publishing both ports does exactly that.
name: mlc-dev

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: moodle
      POSTGRES_PASSWORD: moodle
      POSTGRES_DB: moodle
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "moodle"]
      interval: 2s
      retries: 30

  api:
    build: ..
    # Model and embedding settings: dev/.env (see dev/.env.example).
    env_file: .env
    # Stack wiring, overriding anything in .env.
    environment:
      MLC_DATA_DIR: /data
      MLC_SECURITY__MASTER_KEY_FILE: /data/master.key
      MLC_SECURITY__REQUIRE_TLS: "false"
      MLC_SERVER__BURST_PER_MINUTE: "200"
    entrypoint: ["sh", "-c"]
    # First start: create a master key and register the Moodle site; the secret goes to
    # Moodle via the shared volume. Both persist in volumes across restarts.
    command:
      - >-
        set -e;
        [ -s /data/master.key ] || moodle-llm-chat gen-master-key --out /data/master.key;
        if [ ! -s /shared/site-secret ]; then
        moodle-llm-chat site add dev --name "Dev Moodle" --url http://localhost:8080
        | tail -1 > /shared/site-secret;
        fi;
        moodle-llm-chat doctor;
        exec moodle-llm-chat serve --port 8000
    user: root
    volumes:
      - shared:/shared
      - api-data:/data
    ports:
      - "127.0.0.1:8000:8000" # API (Moodle server side + browser websocket)
      - "127.0.0.1:8080:8080" # Moodle (served from the moodle service, same namespace)
    # Lets MLC_LLM__BASE_URL point at a model server on the host (Ollama, LM Studio).
    extra_hosts:
      - "host.docker.internal:host-gateway"

  moodle:
    build:
      context: ..
      dockerfile: dev/moodle/Dockerfile
    network_mode: "service:api"
    environment:
      E2E_API_URL: http://localhost:8000
    volumes:
      - shared:/shared
      - moodle-data:/var/moodledata
      # Live plugin code: PHP, templates and a rebuilt amd/build apply on reload; a
      # version.php bump needs "restart moodle" (the start runs Moodle's upgrade).
      # Needs Docker to see this checkout (Colima/Docker Desktop file sharing).
      - ../moodle/local_llmchat:/var/www/html/local/llmchat:ro
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/login/index.php"]
      interval: 5s
      retries: 60
      start_period: 60s

volumes:
  pg-data:
  moodle-data:
  shared:
  api-data:
