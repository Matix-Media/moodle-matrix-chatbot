# Real golden question set for `bsbot bench` — see specs/012-benchmarks.md.
#
# Sourced from this deployment's actual index (Klassenkurs IT4bili, Schuljahr
# 2026/27). doc_ids and dates below were confirmed by querying data/index.db
# directly on 2026-09-01; re-verify with `bsbot search` if the corpus changes.
#
# This file names real course/document structure (same kind of detail already
# committed in config/document_aliases.yaml) but no individual student data —
# still, check with your school before committing if you'd rather not.
#
# Two entries below (blockplan-heute, montag-schulbeginn) resolve relative dates
# ("heute", "am Montag") against the pipeline's real clock by default, so what
# they expect changes with the run date. Pin it for a reproducible comparison:
#
#   bsbot bench --golden config/golden_questions.yaml --as-of 2026-09-01
#
# Without --as-of, blockplan-heute and lf10-bewertungsbogen-alias still work
# (their doc_id covers every week of the Blockplan / doesn't depend on the date
# at all), but montag-schulbeginn's expected_keywords can go stale — a later
# Monday may have a different arrival time than the one recorded below.

- id: design-thinking-task
  question: "what is the task for the international design thinking workshop at itech?"
  category: casual-phrasing
  notes: >
    English question against German+English course material. The workshop's dates
    live in one chunk (International Design Thinking Workshop), the actual task
    description in another (Input 'Empathize and define!' / FE). Either answers
    "what is the task", so both headers count.
  expected_header_contains: ["International Design Thinking Workshop", "Empathize and define"]

- id: blockplan-heute
  question: "wie ist der blockplan für heute?"
  category: temporal
  notes: >
    Date-relative (AC-18-style boost in pipeline.py's `_boost`/`_detect_target_date`).
    "heute" must resolve to the real clock date and match the Blockplan chunk
    covering that date (Dienstag 2026-09-01, chunk_id 2017). The doc_id check
    below stays valid on any run date — the whole Blockplan (every week) is one
    document — but a later run is no longer testing the same chunk/date pair
    this note describes; pass --as-of 2026-09-01 to pin it exactly. This entry
    stops being valid at all once the Blockplan document itself is superseded
    by a new term's document.
  expected_doc_ids: ["2250:170418:0"]

- id: montag-schulbeginn
  question: "wann muss ich am montag in die schule gehen?"
  category: casual-phrasing
  notes: >
    "montag" resolves to the next Monday relative to "today" — 2026-09-07 only
    when run with --as-of 2026-09-01 (or on that real date). expected_keywords
    below is that Monday's specific arrival time (9:15 Uhr); a different Monday
    can have a different one (8:15 Uhr appears elsewhere in the same document),
    so without pinning --as-of this entry's keyword_coverage can fail for a
    reason that has nothing to do with retrieval or answer quality. Good
    regression case regardless: plain hybrid search (keyword+vector, no
    boost/rerank) ranks this Blockplan chunk 4th behind two unrelated
    Q&A-board hits — baseline vs. a technique-augmented preset should show a
    real difference here, not just theoretical.
  expected_doc_ids: ["2250:170418:0"]
  expected_keywords: ["9:15"]

- id: block-10-ambiguous
  question: "was muss ich in block 10 machen?"
  category: ambiguous
  notes: >
    Genuinely ambiguous as-is: "Block 10" could mean the Blockplan's 10th lesson
    period (16:15-17:00, present in every Blockplan day) or Lernfeld 10 generally.
    No doc_id/header asserted on purpose — a wrong guess here would silently
    penalize correct retrieval. Kept as an answerable-only smoke test; tighten it
    once you know what a real student meant by it.

- id: board-fragen
  question: "was sind für fragen auf dem board?"
  category: ambiguous
  notes: >
    At least three different "Board" documents exist (LF2 QA Board, LF10 Q&A
    Board, Bosschallenge QA Board) and the question doesn't say which course. No
    retrieval target asserted for the same reason as block-10-ambiguous.

- id: lf10-bewertungsbogen-alias
  question: "Was steht im Bewertungsbogen für Lernfeld 10 für alles für Bewertungsfelder und wie ist die Punkteverteilung?"
  category: institutional-knowledge
  notes: >
    This is the exact alias case documented in specs/007-retrieval.md and
    config/document_aliases.yaml: the file is titled "Bewertung Barcamp" (named
    after the event, not what it grades) with alias phrases baked in
    ("Bewertungsbogen Lernfeld 10", "Punkteverteilung Lernfeld 10 Projekt", ...).
    A run where this entry fails but lf-hk-bewertung succeeds points at the
    alias file/reindex, not at the pipeline.
  expected_doc_ids: ["2250:170434:0"]
  expected_header_contains: ["Bewertung Barcamp"]

- id: lf-hk-bewertung
  question: "Was steht im HK Bewertungsbogen für die betriebliche Projektarbeit?"
  category: lexical-needle
  notes: "A second, differently-worded Lernfeld 10 grading document — no alias needed."
  expected_doc_ids: ["2250:171105:0"]
  expected_header_contains: ["HK Bewertungskriterien"]

- id: wetter-unanswerable
  question: "Wie ist das Wetter heute in Hamburg?"
  category: unanswerable
  answerable: false

