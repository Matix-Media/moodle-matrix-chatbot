[project]
name = "moodle-llm-chat"
version = "0.2.0"
description = "Agentic course assistant for Moodle: ingest API, retrieval tools and streaming chat"
requires-python = ">=3.13"
readme = "README.md"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "typer>=0.12",
    "structlog>=24.1",
    "sqlite-vec>=0.1.9",
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "python-pptx>=0.6",
    "openpyxl>=3.1",
    "selectolax>=0.3",
    "pyyaml>=6.0",
    "xlrd>=2.0",
    "youtube-transcript-api>=1.0",
    "markdownify>=1.0",
    "tiktoken>=0.7",
    # zoneinfo's fallback IANA database — python:slim images have no system tzdata.
    "tzdata>=2024.1",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    # Agent loop and provider adapters.
    "langchain>=1.2",
    "langchain-core>=1.2",
    "langgraph>=1.0",
    "langchain-google-genai>=3.0",
    "langchain-openai>=1.0",
    "langchain-ollama>=1.0",
    "langchain-anthropic>=1.0",
    # Security: encryption at rest and chat tokens.
    "sqlcipher3>=0.6.5",
    "cryptography>=43",
    "pyjwt>=2.9",
]

[project.scripts]
moodle-llm-chat = "moodle_llm_chat.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "time-machine>=2.14",
    "xlwt>=1.3",
    "ruff>=0.5",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/moodle_llm_chat"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
markers = [
    "live: hits real external services; deselected by default (run with -m live)",
    "integration: real components wired in-process (tests/integration)",
    "e2e: full docker topology with Moodle + plugin + API (tests/e2e)",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "B008",    # typer uses function calls in argument defaults
    "RUF001",  # German text and typographic separators (›, ä, ü) are intentional
    "RUF002",
    "RUF003",
]

[tool.mypy]
python_version = "3.13"
mypy_path = "src"
packages = ["moodle_llm_chat"]
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true
