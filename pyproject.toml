[project]
name = "bsbot"
version = "0.1.0"
description = "Matrix chatbot answering Berufsschule questions from Moodle content"
requires-python = ">=3.13"
dependencies = [
    "matrix-nio[e2e]==0.26.0",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "typer>=0.12",
    "structlog>=24.1",
    "sqlite-vec>=0.1.9",
    "google-genai>=2.0",
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "python-pptx>=0.6",
    "openpyxl>=3.1",
    "selectolax>=0.3",
    "pyyaml>=6.0",
    "xlrd>=2.0",
    "youtube-transcript-api>=1.0",
    "markdownify>=1.0",
    "tiktoken>=0.7",
    # zoneinfo's fallback IANA database — python:slim images have no system
    # tzdata, so ZoneInfo("Europe/Berlin") would otherwise fail at runtime.
    "tzdata>=2024.1",
    # Internal HTTP API for the Nuxt web chat frontend (spec 014) — `bsbot
    # serve-api`. Core functionality like the Matrix bot, not an opt-in extra
    # like `pii` below: there is no toggle that makes bsbot.api unused.
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
bsbot = "bsbot.cli:app"

[project.optional-dependencies]
# Only needed when BSBOT_PII__ENABLED=true — kept out of the base install and
# out of `dev` so the common case pays no cost for it. After installing, also
# run `python -m spacy download de_core_news_md` (or the model named by
# BSBOT_PII__SPACY_MODEL).
pii = [
    "spacy>=3.7,<4.0",
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "time-machine>=2.14",
    "xlwt>=1.3",
    "ruff>=0.5",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bsbot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
markers = [
    "live: hits real external services; deselected by default (run with -m live)",
    "eval: retrieval quality evaluation; needs an indexed corpus",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "B008",    # typer uses function calls in argument defaults
    "RUF001",  # German text and typographic separators (›, ä, ü) are intentional
    "RUF002",
    "RUF003",
]

[tool.mypy]
python_version = "3.13"
mypy_path = "src"
packages = ["bsbot"]
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true
