# The API is the only service: Moodle (with the local_llmchat plugin) pushes content to
# it and the browser chat connects to it over a websocket. Put a TLS-terminating reverse
# proxy in front of it — the plugin refuses plain-http API URLs.
services:
  api:
    build: .
    command: ["serve"]
    env_file: .env
    environment:
      MLC_DATA_DIR: /data
    volumes:
      - mlc-data:/data
    # The master key is mounted as a secret, never baked into an env file.
    secrets:
      - mlc_master_key
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped

secrets:
  mlc_master_key:
    file: ./secrets/master.key

volumes:
  mlc-data:
